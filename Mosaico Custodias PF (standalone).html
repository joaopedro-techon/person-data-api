document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f0c3f00b-378e-4767-9252-345c77328dab\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n  @font-face{font-family:'Itau Display';font-weight:700;font-display:swap;src:url(\"31031a11-29b1-4772-8d44-b671d16935bb\") format('woff2');}\n  @font-face{font-family:'Itau Text';font-weight:400;font-display:swap;src:url(\"d2193d79-23d4-434c-9998-3757dc788264\") format('woff2');}\n  @font-face{font-family:'Itau Text';font-weight:700;font-display:swap;src:url(\"4a39b2bf-2849-44e8-ae7a-a7984476badf\") format('woff2');}\n  *{box-sizing:border-box;margin:0;padding:0;}\n  html,body{background:#EEF1F5;font-family:'Itau Text',-apple-system,BlinkMacSystemFont,sans-serif;color:#16233B;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}\n  @keyframes tmGrow{from{opacity:0;transform:scale(.84);}to{opacity:1;transform:scale(1);}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-screen-label=\"Produto x Custódia PF\" style=\"width:1480px;margin:0 auto;padding:26px 30px 32px;display:flex;flex-direction:column;gap:18px;background:#EEF1F5;\">\n\n  <!-- HEADER -->\n  <header style=\"display:flex;align-items:center;justify-content:space-between;background:#FFFFFF;border:1px solid #E3E8EF;border-radius:18px;padding:19px 26px;box-shadow:0 1px 3px rgba(22,35,59,.05);\">\n    <div style=\"display:flex;align-items:center;gap:16px;\">\n      <div style=\"width:46px;height:46px;border-radius:13px;background:linear-gradient(150deg,#EC7000,#FF8A1E);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(236,112,0,.32);\">\n        <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"3.4\" rx=\"1.4\" fill=\"#fff\"><\u002Frect><rect x=\"3\" y=\"10.3\" width=\"18\" height=\"3.4\" rx=\"1.4\" fill=\"#fff\" opacity=\".7\"><\u002Frect><rect x=\"3\" y=\"16.6\" width=\"18\" height=\"3.4\" rx=\"1.4\" fill=\"#fff\" opacity=\".7\"><\u002Frect><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:3px;\">\n        <div style=\"display:flex;align-items:center;gap:10px;\">\n          <h1 style=\"font-family:'Itau Display';font-weight:700;font-size:24px;letter-spacing:-.01em;color:#16233B;line-height:1;\">Custódia de Ativos PF · Modernização do pós-venda<\u002Fh1>\n          <span style=\"font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#EC7000;background:#FFF1E6;border:1px solid #FBD9BC;border-radius:6px;padding:3px 8px;white-space:nowrap;\">Visão executiva<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;color:#65718A;\">Mapa da carteira, distribuição por funcionalidade e detalhe produto × custódia · <strong style=\"color:#C45A00;\">moderno<\u002Fstrong> vs. <strong style=\"color:#5C6878;\">legado<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:right;display:flex;flex-direction:column;gap:2px;\">\n      <span style=\"font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9AA4B6;\">Posição<\u002Fspan>\n      <span style=\"font-size:13px;font-weight:700;color:#16233B;\">{{ asOfDate }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- TAB NAV -->\n  <div style=\"display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #E3E8EF;border-radius:15px;padding:7px;box-shadow:0 1px 3px rgba(22,35,59,.05);\">\n    <button onclick=\"{{ goMapa }}\" style=\"{{ tabMapaStyle }}\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"3\" y=\"3\" width=\"8\" height=\"8\" rx=\"2\" fill=\"currentColor\"><\u002Frect><rect x=\"13\" y=\"3\" width=\"8\" height=\"8\" rx=\"2\" fill=\"currentColor\" opacity=\".5\"><\u002Frect><rect x=\"3\" y=\"13\" width=\"8\" height=\"8\" rx=\"2\" fill=\"currentColor\" op :center;\">\n          <sc-for list=\"{{ f.ex }}\" as=\"e\" hint-placeholder-count=\"3\">\n            <span style=\"font-size:10px;color:#5C6878;background:#F4F6F9;border:1px solid #E7ECF2;border-radius:5px;padding:2px 7px;\">{{ e }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <!-- total geral -->\n    <div style=\"display:grid;grid-template-columns:166px 1.15fr 104px 214px 214px 1.2fr;gap:12px;align-items:stretch;padding:9px 14px 4px;border-top:2px solid #E7EBF1;margin-top:4px;\">\n      <span style=\"font-size:12.5px;font-weight:700;font-family:'Itau Display';color:#16233B;align-self:center;\">Total geral<\u002Fspan>\n      <span><\u002Fspan>\n      <div style=\"text-align:right;align-self:center;\"><div style=\"font-size:12.5px;font-weight:700;font-family:'Itau Display';color:#16233B;\">{{ func.grandTotLabel }}<\u002Fdiv><div style=\"font-size:10px;color:#9AA4B6;\">100%<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#FFF1E6;border-radius:7px;display:grid;grid-template-columns:1fr 1.15fr;gap:8px;align-items:center;padding:8px 10px;\">\n        <span style=\"font-size:12.5px;font-weight:700;font-family:'Itau Display';color:#16233B;text-align:right;\">{{ func.modLabel }}<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:700;font-family:'Itau Display';color:#C45A00;\">{{ func.modPctLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#EEF1F6;border-radius:7px;display:grid;grid-template-columns:1fr 1.15fr;gap:8px;align-items:center;padding:8px 10px;\">\n        <span style=\"font-size:12.5px;font-weight:700;font-family:'Itau Display';color:#16233B;text-align:right;\">{{ func.legLabel }}<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:700;font-family:'Itau Display';color:#5C6878;\">{{ func.legPctLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <span><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- leituras + notas -->\n  <div style=\"display:flex;gap:14px;align-items:stretch;\">\n    <div style=\"flex:1;background:#FFF7EF;border:1px solid #FBDDC0;border-radius:16px;padding:16px 20px;box-shadow:0 1px 3px rgba(22,35,59,.05);\">\n      <div style=\"font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#C45A00;margin-bottom:9px;\">Leituras executivas<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:7px;\">\n        <p style=\"font-size:11.5px;color:#7A4E1E;line-height:1.4;\">● <strong style=\"color:#16233B;\">{{ func.modPctLabel }}<\u002Fstrong> das solicitações de pós-venda já são processadas no moderno (AWS).<\u002Fp>\n        <p style=\"font-size:11.5px;color:#7A4E1E;line-height:1.4;\">● <strong style=\"color:#16233B;\">Amortização<\u002Fstrong> e <strong style=\"color:#16233B;\">2ª via de boleto<\u002Fstrong> concentram a maior parte do volume de solicitações.<\u002Fp>\n        <p style=\"font-size:11.5px;color:#7A4E1E;line-height:1.4;\">● <strong style=\"color:#16233B;\">Portabilidade<\u002Fstrong> e <strong style=\"color:#16233B;\">Repactuação<\u002Fstrong> apresentam a maior dependência do legado.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:0 0 420px;background:#fff;border:1px solid #E3E8EF;border-radius:16px;padding:16px 20px;box-shadow:0 1px 3px rgba(22,35,59,.05);\">\n      <div style=\"font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9AA4B6;margin-bottom:9px;\">Notas<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:11px;color:#65718A;line-height:1.4;\">\n        <span>· Solicitações únicas consideradas (deduplicadas).<\u002Fspan>\n        <span>· Período analisado: últimos 12 meses.<\u002Fspan>\n        <span>· Percentuais podem sofrer pequenas variações por arredondamento.<\u002Fspan>\n        <span>· \"Funcionalidade\" = tipo de manutenção de pós-venda · Moderno = AWS · Legado = mainframe.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:2px 6px;\">\n    <span style=\"font-size:10.5px;color:#9AA4B6;\">Custódias: <strong style=\"color:#65718A;\">SF · F5 · SO · F8 · OD<\u002Fstrong> (mainframe) · <strong style=\"color:#2A6FDB;\">GC<\u002Fstrong> (cloud) · <strong style=\"color:#65718A;\">Dados ilustrativos<\u002Fstrong>.<\u002Fspan>\n    <span style=\"font-size:10.5px;color:#9AA4B6;\">% na faixa = participação da custódia na carteira · % ao lado do produto = participação na sua custódia · M/L/– por tipo<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:1700},&quot;asOfDate&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Junho 2026&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { view:'hoje', open:null, animate:true, tab:'mapa' };\n  _setTab(t) { this.setState({ tab:t }); if (t === 'mapa') this._flash(); }\n  _flash() { clearTimeout(this._ft); this.setState({ animate:true }); this._ft = setTimeout(() => this.setState({ animate:false }), 700); }\n  _open(code) { this.setState({ open:code }); this._flash(); }\n  _close() { this.setState({ open:null }); this._flash(); }\n  _setView(v) { this.setState({ view:v }); }\n  build() {\n    const fmt = n => n.toLocaleString('pt-BR');\n    let seed = 20260616;\n    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };\n\n    const types = [\n      { key:'CANC', name:'Cancelamento',  thr:30, w:8,  naFam:[], desc:'Cancelamento de operação ou parcela de crédito', ex:['Cancelamento de contrato','Cancelamento de parcela','Reversão de desembolso'] },\n      { key:'AMOR', name:'Amortização',   thr:25, w:14, naFam:[], desc:'Amortização e abatimento de saldo devedor', ex:['Amortização extraordinária','Abatimento de saldo','Pagamento parcial'] },\n      { key:'COBR', name:'Alteração de cobrança', thr:20, w:6, naFam:['Cheque','LIS','Adiantamento'], desc:'Mudança de meio de cobrança e vencimento', ex:['Troca de meio de cobrança','Alteração de vencimento','Conta de débito'] },\n      { key:'LIQ',  name:'Liquidação',    thr:48, w:5,  naFam:[], desc:'Liquidação antecipada e quitação', ex:['Liquidação antecipada','Quitação total','Certidão de quitação'] },\n      { key:'EST',  name:'Estorno',       thr:40, w:7,  naFam:[], desc:'Estornos e ajustes de lançamento', ex:['Estorno de tarifa','Ajuste de lançamento','Correção de valor'] },\n      { key:'REPA', name:'Repactuação',   thr:62, w:4,  naFam:['Cheque','LIS','Adiantamento','Parcelado'], desc:'Repactuação e renegociação de dívida', ex:['Repactuação de prazo','Renegociação','Composição de dívida'] },\n      { key:'PORT', name:'Portabilidade', thr:78, w:3,  naFam:['Cheque','LIS','Antecipação','Adiantamento','Microcrédito','Leasing','Parcelado','Limite'], desc:'Portabilidade de crédito entre instituições', ex:['Portabilidade de entrada','Portabilidade de saída','Refinanciamento'] },\n      { key:'BOL',  name:'2ª via de boleto', thr:15, w:16, naFam:['Cheque','LIS','Adiantamento'], desc:'Emissão de boletos, extratos e informes', ex:['2ª via de boleto','Emissão de extrato','Informe de rendimentos'] },\n    ];\n    const typeMod = types.map(() => 0);\n    const typeLeg = types.map(() => 0);\n\n    const datePool = ['15/06/2026','14/06/2026','13/06/2026','12/06/2026','09/06/2026','03/05/2026','28/01/2026','19/11/2025','05/02/2024'];\n    const today = new Date(2026,5,16);\n    const parse = s => { const [d,m,y]=s.split('/').map(Number); return new Date(y,m-1,d); };\n\n    const cuStyle = cloud => cloud\n      ? {bg:'#E8F0FD', color:'#2A6FDB', border:'#BFD6F7'}\n      : {bg:'#EEF1F6', color:'#5C6878', border:'#E1E6EE'};\n\n    const defs = [\n      { code:'SF', cloud:false, avg:62, items:[\n        ['Crediário Loja','Crediário'],['Crediário Online','Crediário'],['Empréstimo Pessoal Digital','Empréstimo'],\n        ['Empréstimo Pessoal Folha','Empréstimo'],['CDC Veículo Novo','CDC'],['CDC Veículo Usado','CDC'],\n        ['CDC Veículo Moto','CDC'],['Conta Garantida PF','Conta Garantida'],['Crédito Parcelado Fatura','Parcelado'],\n        ['Empréstimo Pré-aprovado','Empréstimo'],['Crediário Renovação','Crediário'],['CDC Veículo Pesado','CDC'],\n      ]},\n      { code:'OD', cloud:false, avg:45, items:[\n        ['Cheque Especial Clássico','Cheque'],['Cheque Especial Uniclass','Cheque'],['Cheque Especial Personnalité','Cheque'],\n        ['LIS Limite Inteligente','LIS'],['LIS Limite Programada','LIS'],['Antecipação de Recebíveis Cartão','Antecipação'],\n        ['Adiantamento de Salário','Adiantamento'],['Adiantamento 13º','Adiantamento'],\n      ]},\n      { code:'F5', cloud:false, avg:38, items:[\n        ['Consignado Público Federal','Consignado'],['Consignado Público Estadual','Consignado'],['Consignado Público Municipal','Consignado'],\n        ['Consignado INSS Aposentado','Consignado'],['Consignado INSS Pensionista','Consignado'],['Consignado INSS Refin','Consignado'],\n        ['Consignado Privado Convênio A','Consignado'],['Consignado Privado Convênio B','Consignado'],['Cartão Consignado Benefício','Consignado'],\n        ['Cartão Consignado RMC','Consignado'],\n      ]},\n      { code:'SO', cloud:false, avg:22, items:[\n        ['Imobiliário SFH Pré-fixado','Imobiliário'],['Imobiliário SFH TR','Imobiliário'],['Imobiliário SFH IPCA','Imobiliário'],\n        ['Imobiliário SFI IPCA','Imobiliário'],['Home Equity PF','Home Equity'],['Home Equity Reforma','Home Equity'],\n        ['Financiamento Construção Obra','Construção'],['Portabilidade Imobiliária','Imobiliário'],['Imobiliário SFH Pós-fixado','Imobiliário'],\n      ]},\n      { code:'F8', cloud:false, avg:13, items:[\n        ['Financiamento de Veículo Novo','Veículo'],['Financiamento de Veículo Usado','Veículo'],['Financiamento de Veículo Moto','Veículo'],\n        ['Financiamento de Veículo Pesado','Veículo'],['CDC Lojista Móveis','CDC Lojista'],['CDC Lojista Eletro','CDC Lojista'],\n        ['Microcrédito Produtivo','Microcrédito'],['Microcrédito MEI','Microcrédito'],['Crédito Rural Custeio','Crédito Rural'],\n        ['Crédito Rural Investimento','Crédito Rural'],['Leasing Veículo','Leasing'],['Leasing Equipamento','Leasing'],\n      ]},\n      { code:'GC', cloud:true, avg:90, items:[\n        ['Crédito Digital App','Crédito Digital'],['Crédito Digital Web','Crédito Digital'],['Parcelado da Fatura Automático','Parcelado'],\n        ['Parcelado da Fatura Sob Demanda','Parcelado'],['Empréstimo no App Express','Empréstimo'],['Empréstimo no App Garantido','Empréstimo'],\n        ['Limite Inteligente Digital','Limite'],\n      ]},\n      { code:'CL', cloud:false, avg:33, items:[\n        ['Cartão Crediário Loja','Cartão'],['Cartão Parcelado','Cartão'],['Cartão Saque','Cartão'],\n        ['Limite Rotativo','Cartão'],['Cartão Consignado CL','Cartão'],\n      ]},\n      { code:'SF3', cloud:false, avg:58, items:[\n        ['Empréstimo Pessoal III','Empréstimo'],['Crediário Express III','Crediário'],['CDC Serviços III','CDC'],\n        ['Refin III','Empréstimo'],['Crédito Renovação III','Crediário'],\n      ]},\n      { code:'SF4', cloud:false, avg:27, items:[\n        ['Financiamento Estendido IV','CDC'],['Crédito Sazonal IV','Empréstimo'],['CDC Bens IV','CDC'],\n        ['Empréstimo Garantido IV','Empréstimo'],\n      ]},\n    ];\n\n    const compact = n => {\n      if (n >= 1000000) return (n/1000000).toFixed(1).replace('.',',')+' mi';\n      if (n >= 1000) return (n/1000).toFixed(1).replace('.',',')+' mil';\n      return String(n);\n    };\n    const pctOf = (o,t) => { const v = o/t*100; return v < 0.1 ? '<0,1%' : v.toFixed(1).replace('.',',')+'%'; };\n    const contr2026Pool = ['15/06/2026','28/05/2026','11/04/2026','02/03/2026','19/01/2026'];\n    const contrOldPool = ['12/11/2025','03/08/2025','24/02/2025','09/07/2024','15/03/2023'];\n    const modDatePool = ['16/06/2026','15/06/2026','12/06/2026','09/06/2026','28/05/2026'];\n    const legDatePool = ['14/06/2026','03/05/2026','19/11/2025','21/05/2024','05/02/2018'];\n\n    const famOf = item => item[1];\n    let total=0, contrCount=0, inativos=0, disfCount=0, modCellsTot=0, applCellsTot=0;\n    const allRows = []; let totalOps = 0;\n\n    const groups = defs.map(d => {\n      let bandMod=0, bandAppl=0;\n      const rows = d.items.map((it, idx) => {\n        const [name, fam] = it;\n        let pct = Math.round(d.avg + ((idx % 5) - 2) * 9);\n        if (d.cloud) pct = 88 + (idx % 3) * 4;\n        pct = Math.max(3, Math.min(99, pct));\n        // disfunção\n        let resp='PF', escopo=true;\n        if (d.code==='OD' && name.startsWith('Antecipação')) resp='PJ';\n        if (d.code==='F8' && name.startsWith('Crédito Rural')) escopo=false;\n        const isDisf = resp!=='PF' || !escopo;\n        if (isDisf) disfCount++;\n        // atributos\n        const last = datePool[Math.floor(rnd()*datePool.length)];\n        const stale = (today - parse(last))/86400000 > 180;\n        const ativo = rnd() > 0.07;\n        const contr = !isDisf && ativo && rnd() < 0.58;\n        total++; if (contr) contrCount++; if (!ativo) inativos++;\n        // operações da carteira + total de solicitações de pós-venda\n        const ops = ativo ? Math.round(15000 + rnd()*rnd()*1800000) : Math.round(rnd()*3500);\n        totalOps += ops;\n        const solicTot = Math.round(ops * (0.15 + rnd()*0.25));\n        // peso das solicitações entre os tipos aplicáveis\n        const naArr = types.map(t => t.naFam.some(f => fam.startsWith(f) || name.startsWith(f)));\n        let wSum = 0; types.forEach((t,i) => { if (!naArr[i]) wSum += t.w; });\n        // cells: M = só moderno · L = só legado · B = nas duas plataformas (em migração)\n        let rowMod = 0, rowLeg = 0;\n        const cells = types.map((t, i) => {\n          if (naArr[i]) return { single:true, both:false, letter:'–', bg:'#F7F9FC', border:'1px dashed #DBE1EA', txt:'#AEB8C7', tipTitle:name+' · '+t.name, tipMod:'', tipLeg:'', tipNa:'1' };\n          let state;\n          if (pct >= t.thr + 18) state = 'M';\n          else if (pct >= t.thr) state = 'B';\n          else state = 'L';\n          const sc = state === 'M' ? 1 : (state === 'B' ? 0.5 : 0);\n          if (!isDisf) { bandAppl++; applCellsTot++; bandMod += sc; modCellsTot += sc; }\n          const typeTot = wSum ? Math.round(solicTot * t.w / wSum) : 0;\n          let qMod = 0, qLeg = 0;\n          if (state === 'M') qMod = typeTot;\n          else if (state === 'L') qLeg = typeTot;\n          else { qMod = Math.round(typeTot * (0.45 + rnd()*0.25)); qLeg = typeTot - qMod; }\n          rowMod += qMod; rowLeg += qLeg;\n          typeMod[i] += qMod; typeLeg[i] += qLeg;\n          const dMod = modDatePool[Math.floor(rnd()*modDatePool.length)];\n          const dLeg = legDatePool[Math.floor(rnd()*legDatePool.length)];\n          const tipTitle = name + ' · ' + t.name;\n          const tipMod = qMod > 0 ? compact(qMod) + ' · ' + dMod : '';\n          const tipLeg = qLeg > 0 ? compact(qLeg) + ' · ' + dLeg : '';\n          if (state === 'B') return { single:false, both:true, border:'none', tipTitle, tipMod, tipLeg, tipNa:'' };\n          if (state === 'M') return { single:true, both:false, letter:'M', bg:'#EC7000', border:'none', txt:'#fff', tipTitle, tipMod, tipLeg, tipNa:'' };\n          return { single:true, both:false, letter:'L', bg:'#E1E6EE', border:'none', txt:'#5C6878', tipTitle, tipMod, tipLeg, tipNa:'' };\n        });\n        // última contratação\n        const lastContr = contr ? contr2026Pool[Math.floor(rnd()*contr2026Pool.length)] : contrOldPool[Math.floor(rnd()*contrOldPool.length)];\n        const row = {\n          name, isDisf,\n          disfTitle: resp!=='PF' ? ('Disfunção — responsabilidade '+resp) : 'Disfunção — fora de escopo',\n          nameColor: isDisf ? '#B5271A' : '#16233B',\n          rowBg: isDis odGoal + '%'\n        : (t.cloud ? 'Cloud · ' : '') + 'Pós-venda ' + t.modNow + '%';\n      return {\n        label:t.label, desc:t.desc, opsLabel:t.opsLabel, pct:t.pct, pctWhat:t.pctWhat,\n        left:t.x+'%', top:t.y+'%', w:t.w+'%', h:t.h+'%',\n        bg, border, codeColor, badgeBg, badgeColor, badgeBorder, descColor, fillColor, accent, headBg,\n        platTag, statusLabel, halo,\n        fillPct: fill+'%', basePct: t.modNow+'%', badgeLabel, modLabel: fill+'%',\n        modWhat: st.view==='meta' ? 'meta no moderno' : 'no moderno',\n        big: !t.small, small: t.small, showMarker: st.view === 'meta',\n        anim: st.animate ? ('tmGrow .5s both ' + (i*0.04).toFixed(2) + 's') : 'none',\n        cursor: isCustody ? 'pointer' : 'default',\n        onClick: isCustody ? (() => this._open(t.code)) : null,\n        title: t.label + (t.desc ? (' · '+t.desc) : '') + ' · ' + t.opsLabel + ' operações (' + t.pct + ' ' + t.pctWhat + ') · pós-venda ' + (st.view==='meta' ? ('meta '+t.modGoal) : t.modNow) + '%',\n      };\n    };\n    const drill = !!st.open && !!b.productTiles[st.open];\n    const raw = drill ? b.productTiles[st.open] : b.custodyTiles;\n    const tiles = raw.map(decorate);\n    // atlas nodes\n    const blobs = ['47% 53% 52% 48% / 55% 49% 51% 45%','53% 47% 46% 54% / 48% 55% 45% 52%','49% 51% 55% 45% / 51% 46% 54% 49%'];\n    const decoNode = (n, i) => {\n      const fill = st.view === 'meta' ? n.modGoal : n.modNow;\n      let bg, border, codeColor, badgeBg, badgeColor, badgeBorder, descColor;\n      if (n.cloud) {\n        bg='radial-gradient(120% 120% at 35% 25%,#EAF2FD,#CFE0FA)'; border='#A9C8F2'; codeColor='#2A6FDB';\n        badgeBg='#FFFFFF'; badgeColor='#2A6FDB'; badgeBorder='#BFD6F7'; descColor='#5172A0';\n      } else if (fill >= 50) {\n        bg='radial-gradient(120% 120% at 35% 25%,#FFEFDD,#FBD3AC)'; border='#F2B981'; codeColor='#C45A00';\n        badgeBg='#EC7000'; badgeColor='#FFFFFF'; badgeBorder='#EC7000'; descColor='#B07A4A';\n      } else { ), legOpsLabel:fmtN(legOps) };\n    });\n    const gc = b.mapNodes.find(n => n.cloud) || {x:85,y:44};\n    const mapRoutes = b.mapNodes.filter(n => !n.cloud).map(n => ({\n      x1:n.x+'%', y1:n.y+'%', x2:gc.x+'%', y2:gc.y+'%',\n    }));\n    const btnBase = \"border:none;cursor:pointer;font-family:'Itau Text',sans-serif;font-size:11px;font-weight:700;border-radius:7px;padding:5px 13px;transition:all .15s;\";\n    const onB = btnBase + 'background:#EC7000;color:#fff;box-shadow:0 2px 6px rgba(236,112,0,.3);';\n    const offB = btnBase + 'background:transparent;color:#65718A;';\n    // tab nav\n    const tabBase = \"border:none;cursor:pointer;font-family:'Itau Display',sans-serif;font-weight:700;font-size:13px;padding:11px 20px;border-radius:11px;transition:all .15s;display:flex;align-items:center;gap:8px;\";\n    const tabOn = tabBase + 'background:#16233B;color:#fff;box-shadow:0 4px 12px -3px rgba(22,35,59,.3);';\n    const tabOff = tabBase + 'background:transparent;color:#65718A;';\n    const tab = st.tab;\n    return {\n      asOfDate: this.props.asOfDate ?? 'Junho 2026',\n      types: b.types, groups: b.groups, kpi: b.kpi, func: b.func,\n      tiles, drill, mapNodes, mapRoutes, mekkoCols, overall, mosaicTiles,\n      tabMapa: tab==='mapa', tabDetalhe: tab==='detalhe', tabFunc: tab==='func', tabMatriz: tab==='matriz',\n      tabMapaStyle: tab==='mapa' ? tabOn : tabOff,\n      tabMatrizStyle: tab==='matriz' ? tabOn : tabOff,\n      tabDetalheStyle: tab==='detalhe' ? tabOn : tabOff,\n      tabFuncStyle: tab==='func' ? tabOn : tabOff,\n      goMapa: () => this._setTab('mapa'),\n      goMatriz: () => this._setTab('matriz'),\n      goDetalhe: () => this._setTab('detalhe'),\n      goFunc: () => this._setTab('func'),\n      mapHeading: drill ? ('Custódia ' + st.open + ' · produtos da carteira') : 'Mapa das custódias · carteira de crédito PF',\n      hojeStyle: st.view==='hoje' ? onB : offB,\n      metaStyle: st.view==='meta' ? onB : offB,\n      setHoje: () => this._setVi
